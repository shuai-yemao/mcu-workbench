name: CI

on:
  push:
    branches: [host_ai]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试（jest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 运行单元测试
        run: npm test

  validate:
    name: 插件契约校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 插件契约校验（skills/agents/分层）
        run: npm run validate:plugin
      - name: 文档链接校验
        run: npm run validate:links
      - name: 版本一致性
        run: npm run check:versions
      - name: 分层契约自检
        run: npm run validate:layer
      - name: Codex 产物一致性
        run: npm run build:codex-compat && git diff --exit-code

  workflow-gate:
    name: Router-first 交付门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 执行 Workflow Gate
        shell: bash
        run: |
          set +e
          echo "workflow_gate_stage=validate"
          npm run validate:workflow-gate -- --root "$GITHUB_WORKSPACE" --json --strict
          exit_code=$?
          echo "workflow_gate_exit_code=$exit_code"
          if [ "$exit_code" -ne 0 ]; then
            echo "::error title=Workflow Gate blocked::请查看上方 JSON 输出中的 blocking_reasons 和 missing_items。"
          fi
          exit "$exit_code"

  firmware-syntax:
    name: 固件 C 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 固件模板语法检查
        run: gcc -Wall -Wextra -fsyntax-only -I templates/bsp-oled templates/bsp-oled/impl_oled_driver.c
